{% extends 'base.html' %}
{% block content %}
  <div class="container">

    <!--<div class="info-box">-->
    <!--  <div>FEN: <span id="fenSpan"></span></div>-->
    <!--  <div>PGN: <span id="pgnSpan"></span></div>-->
    <!--</div>-->

    <div class="game-container">
      <div id="myBoard"></div>
      <div class="info-box">
        <h1>Office Chess: Welcome, {{ name }}!</h1>
        <div id="status"></div>
        <table id="pgnTable" class="display compact" cellspacing="0" width="100%">
          <thead>
            <tr>
              <th>Move #</th>
              <th>White Move</th>
              <th>White User</th>
              <th>Black Move</th>
              <th>Black User</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rows will be dynamically added -->
          </tbody>
        </table>
        <button onclick="resetGame()">Reset Game</button>
      </div>
    </div>

    <script>
      // Pull initial FEN from the server-side template variable
      const initialFen = "{{ fen }}";

    // Mapping of squares to their left and top percentages for white

        'e8': { left: '50%', top: '0%' }, 'f8': { left: '62.5%', top: '0%' }, 'g8': { left: '75%', top: '0%' }, 'h8': { left: '87.5%', top: '0%' },
        'a7': { left: '0%', top: '12.5%' }, 'b7': { left: '12.5%', top: '12.5%' }, 'c7': { left: '25%', top: '12.5%' }, 'd7': { left: '37.5%', top: '12.5%' },

        'e6': { left: '50%', top: '25%' }, 'f6': { left: '62.5%', top: '25%' }, 'g6': { left: '75%', top: '25%' }, 'h6': { left: '87.5%', top: '25%' },
        'a5': { left: '0%', top: '37.5%' }, 'b5': { left: '12.5%', top: '37.5%' }, 'c5': { left: '25%', top: '37.5%' }, 'd5': { left: '37.5%', top: '37.5%' },
        'e5': { left: '50%', top: '37.5%' }, 'f5': { left: '62.5%', top: '37.5%' }, 'g5': { left: '75%', top: '37.5%' }, 'h5': { left: '87.5%', top: '37.5%' },
        'a4': { left: '0%', top: '50%' }, 'b4': { left: '12.5%', top: '50%' }, 'c4': { left: '25%', top: '50%' }, 'd4': { left: '37.5%', top: '50%' },
        'e4': { left: '50%', top: '50%' }, 'f4': { left: '62.5%', top: '50%' }, 'g4': { left: '75%', top: '50%' }, 'h4': { left: '87.5%', top: '50%' },
        'a3': { left: '0%', top: '62.5%' }, 'b3': { left: '12.5%', top: '62.5%' }, 'c3': { left: '25%', top: '62.5%' }, 'd3': { left: '37.5%', top: '62.5%' },
        'e3': { left: '50%', top: '62.5%' }, 'f3': { left: '62.5%', top: '62.5%' }, 'g3': { left: '75%', top: '62.5%' }, 'h3': { left: '87.5%', top: '62.5%' },
        'a2': { left: '0%', top: '75%' }, 'b2': { left: '12.5%', top: '75%' }, 'c2': { left: '25%', top: '75%' }, 'd2': { left: '37.5%', top: '75%' },
        'e2': { left: '50%', top: '75%' }, 'f2': { left: '62.5%', top: '75%' }, 'g2': { left: '75%', top: '75%' }, 'h2': { left: '87.5%', top: '75%' },
        'a1': { left: '0%', top: '87.5%' }, 'b1': { left: '12.5%', top: '87.5%' }, 'c1': { left: '25%', top: '87.5%' }, 'd1': { left: '37.5%', top: '87.5%' },
        'e1': { left: '50%', top: '87.5%' }, 'f1': { left: '62.5%', top: '87.5%' }, 'g1': { left: '75%', top: '87.5%' }, 'h1': { left: '87.5%', top: '87.5%' }
    };

    // Mapping of squares to their left and top percentages for black
    const squareToPositionBlack = {
        'a1': { left: '87.5%', top: '0%' }, 'b1': { left: '75%', top: '0%' }, 'c1': { left: '62.5%', top: '0%' }, 'd1': { left: '50%', top: '0%' },
        'e1': { left: '37.5%', top: '0%' }, 'f1': { left: '25%', top: '0%' }, 'g1': { left: '12.5%', top: '0%' }, 'h1': { left: '0%', top: '0%' },
        'a2': { left: '87.5%', top: '12.5%' }, 'b2': { left: '75%', top: '12.5%' }, 'c2': { left: '62.5%', top: '12.5%' }, 'd2': { left: '50%', top: '12.5%' },
        'e2': { left: '37.5%', top: '12.5%' }, 'f2': { left: '25%', top: '12.5%' }, 'g2': { left: '12.5%', top: '12.5%' }, 'h2': { left: '0%', top: '12.5%' },
        'a3': { left: '87.5%', top: '25%' }, 'b3': { left: '75%', top: '25%' }, 'c3': { left: '62.5%', top: '25%' }, 'd3': { left: '50%', top: '25%' },
        'e3': { left: '37.5%', top: '25%' }, 'f3': { left: '25%', top: '25%' }, 'g3': { left: '12.5%', top: '25%' }, 'h3': { left: '0%', top: '25%' },
        'a4': { left: '87.5%', top: '37.5%' }, 'b4': { left: '75%', top: '37.5%' }, 'c4': { left: '62.5%', top: '37.5%' }, 'd4': { left: '50%', top: '37.5%' },
        'e4': { left: '37.5%', top: '37.5%' }, 'f4': { left: '25%', top: '37.5%' }, 'g4': { left: '12.5%', top: '37.5%' }, 'h4': { left: '0%', top: '37.5%' },
        'a5': { left: '87.5%', top: '50%' }, 'b5': { left: '75%', top: '50%' }, 'c5': { left: '62.5%', top: '50%' }, 'd5': { left: '50%', top: '50%' },
        'e5': { left: '37.5%', top: '50%' }, 'f5': { left: '25%', top: '50%' }, 'g5': { left: '12.5%', top: '50%' }, 'h5': { left: '0%', top: '50%' },
        'a6': { left: '87.5%', top: '62.5%' }, 'b6': { left: '75%', top: '62.5%' }, 'c6': { left: '62.5%', top: '62.5%' }, 'd6': { left: '50%', top: '62.5%' },
        'e6': { left: '37.5%', top: '62.5%' }, 'f6': { left: '25%', top: '62.5%' }, 'g6': { left: '12.5%', top: '62.5%' }, 'h6': { left: '0%', top: '62.5%' },
        'a7': { left: '87.5%', top: '75%' }, 'b7': { left: '75%', top: '75%' }, 'c7': { left: '62.5%', top: '75%' }, 'd7': { left: '50%', top: '75%' },
        'e7': { left: '37.5%', top: '75%' }, 'f7': { left: '25%', top: '75%' }, 'g7': { left: '12.5%', top: '75%' }, 'h7': { left: '0%', top: '75%' },
        'a8': { left: '87.5%', top: '87.5%' }, 'b8': { left: '75%', top: '87.5%' }, 'c8': { left: '62.5%', top: '87.5%' }, 'd8': { left: '50%', top: '87.5%' },
        'e8': { left: '37.5%', top: '87.5%' }, 'f8': { left: '25%', top: '87.5%' }, 'g8': { left: '12.5%', top: '87.5%' }, 'h8': { left: '0%', top: '87.5%' }
    };

      // Initialize the Chessboard2
      const board = Chessboard2('myBoard', {
        position: initialFen,
        draggable: true,
        dropOffBoard: 'snapback',
        pieceTheme: 'static/chesspieces/wikipedia/{piece}.png',

        // ================================
        //  onDragStart: highlight moves
        // ================================
        onDragStart: function(dragData) {
          // Clear any old circles
          board.clearCircles();

          // Extract square & piece from dragData
          let fromSquare = dragData.square;
          let piece = dragData.piece;
          console.log(`Dragging piece ${piece} from square ${fromSquare}`);

          // If there's no valid square or piece, bail out
          if (!fromSquare || !piece) return;

            // Determine the piece color
            const pieceColor = piece.charAt(0) === 'w' ? 'white' : 'black';

            // Use the appropriate mapping based on the piece color
            const position = pieceColor === 'white' ? squareToPositionWhite[fromSquare] : squareToPositionBlack[fromSquare];
            const pieceElement = document.querySelector(`.piece-349f8[style*="left:${position.left};top:${position.top}"]`);
            console.log('pieceElement:', pieceElement); // Log the pieceElement to the console
            if (pieceElement) {
              pieceElement.style.opacity = 0.5;
            }

          // Ask the server for all possible destination squares
          $.post('/legal_moves', { square: fromSquare }, function(res) {
            if (res && res.moves) {
              console.log(`Server responded with moves:`, res.moves);
              // Add circles for each valid destination
              res.moves.forEach(destSquare => {
                board.addCircle(destSquare);  // default circle
              });
            } else {
              console.log('No moves returned from /legal_moves');
            }
          }).fail(function() {
            console.error('Failed to retrieve legal moves from server');
          });
        },

        // ================================
        //  onDrop: make the move
        // ================================
        onDrop: function(dropData) {
          // Remove circles
          board.clearCircles();

          // Build a UCI-like string, e.g. "e2e4"
          let moveStr = dropData.source + dropData.target;

          $.post('/make_move', { move: moveStr }, function(data) {
            if (data.status === 'ok') {
              board.position(data.fen);
              updateStatus();
            } else {
              // If server says illegal or error => revert
              document.getElementById('status').innerText = data.message;
            }
          }).fail(function() {
            board.position(dropData.oldPos);
            document.getElementById('status').innerText = "Server error, move not processed.";
          });

          return 'snapback';
        }
      });

      // Connect to Socket.IO
      const socket = io(location.origin, { path: '/socket.io' });

      // Listen for "board_update" events from the server
      socket.on('board_update', function(data) {
        console.log("Received board_update from server:", data);
        // data.fen, data.pgn, data.statusText
        if (board) {
          board.position(data.fen);
        }
        updateStatus();
      });

      // Refresh the game status (FEN, PGN, etc.)
      function updateStatus() {
        $.get('/game_status', function(data) {
          if (data) {
            document.getElementById('status').innerText = data.statusText;
            <!--document.getElementById('fenSpan').innerText = data.fen;-->
            <!--document.getElementById('pgnSpan').innerText = data.pgn;-->
            const table = $('#pgnTable').DataTable();
            table.clear(); // Clear existing data
            data.moves.forEach(row => {
              table.row.add([
                row["Move #"],
                row["White Move"],
                row["White User"],
                row["Black Move"],
                row["Black User"]
              ]);
            });
            table.draw();
          }
          if (board) {
            const newOrientation = board.orientation(data.orientation)
          }
        });
      }

      $(document).ready(function() {
        $('#pgnTable').DataTable({
          paging: false,
          searching: true,
          info: false,
          autoWidth: true,
          columnDefs: [
            { className: "dt-center", targets: "_all" }
          ]
        });

        updateStatus();
      });

      // Reset the board (call server /reset)
      function resetGame() {
        window.location.href = "/reset";
      }

      // On page load, get initial status
      updateStatus();
    </script>
  </div>
{% endblock %}

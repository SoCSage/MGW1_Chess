{% extends 'base.html' %}
{% block content %}
  <div class="container">

    <div class="game-container">
      <div id="myBoard"></div>
      <div class="info-box">
        <h1>Office Chess: Welcome, {{ name }}!</h1>
        <div id="status"></div>
        <table id="pgnTable" class="display compact" cellspacing="0" width="100%">
          <thead>
            <tr>
              <th>Move #</th>
              <th>White Move</th>
              <th>White User</th>
              <th>Black Move</th>
              <th>Black User</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rows will be dynamically added -->
          </tbody>
        </table>
        <button onclick="resetGame()">Reset Game</button>
      </div>
    </div>

    <script>
      // Pull initial FEN from the server-side template variable
      const initialFen = "{{ fen }}";

      // Initialize the Chessboard2
      const boardConfig = {
        sparePieces: true,
        position: initialFen,
        draggable: true,
        dropOffBoard: 'snapback',
        pieceTheme: 'static/chesspieces/wikipedia/{piece}.png',
        onDragStart,
        onDrop
      }

      const board = Chessboard2('myBoard', boardConfig)

      function isWhitePiece (piece) { return /^w/.test(piece) }
      function isBlackPiece (piece) { return /^b/.test(piece) }

      let moveOrientationColor;
      let squareElement;

      let currentFEN;
      let viewState = false;

      // ================================
      //  onDragStart: highlight moves
      // ================================
      function onDragStart (dragData) {
        // Clear any old circles
        board.clearCircles();

        if (viewState) return false

        // Extract square & piece from dragData
        let fromSquare = dragData.square;
        let piece = dragData.piece;

        // only pick up pieces for the side to move
        if (moveOrientationColor === 'white' && !isWhitePiece(piece)) return false
        if (moveOrientationColor === 'black' && !isBlackPiece(piece)) return false

        // If there's no valid square or piece, bail out
        if (!fromSquare || !piece) return;

        squareElement = document.querySelector(`[data-square-coord="${fromSquare}"]`);
        if (squareElement) { squareElement.style.opacity = "0.5"; }

        // Ask the server for all possible destination squares
        $.post('/legal_moves', { square: fromSquare }, function(res) {
          if (res && res.moves) {
            // Add circles for each valid destination
            res.moves.forEach(destSquare => {
              board.addCircle(destSquare);  // default circle
            });
          } else {
            console.log('No moves returned from /legal_moves');
          }
        }).fail(function() {
          console.error('Failed to retrieve legal moves from server');
        });
      }

      // ================================
      //  onDrop: make the move
      // ================================
      function onDrop (dropData) {
        // Remove circles
        board.clearCircles();

        if (viewState) return false

        if (squareElement) {
          squareElement.style.opacity = "1.0";
          squareElement = null;
        }

        // Build a UCI-like string, e.g. "e2e4"
        let moveStr = dropData.source + dropData.target;

        $.post('/make_move', { move: moveStr }, function(data) {
          if (data.status === 'ok') {
            board.position(data.fen);
          } else {
            // If server says illegal or error => revert
            document.getElementById('status').innerText = data.message;
          }
        }).fail(function() {
          board.position(dropData.oldPos);
          document.getElementById('status').innerText = "Server error, move not processed.";
        });

        return 'snapback';
      }

      // Connect to Socket.IO
      const socket = io(location.origin, { path: '/socket.io' });

      // Listen for "board_update" events from the server
      socket.on('board_update', function(data) {
        // data.fen, data.pgn, data.statusText
        if (board) {
          board.position(data.fen);
        }
        updateStatus();
      });

      let rowCount;
      let colCount;

      // Refresh the game status (FEN, PGN, etc.)
      function updateStatus() {
        $.get('/game_status', function(data) {
          if (data) {
            document.getElementById('status').innerText = data.statusText;
            currentFEN = data.fen;
            const table = $('#pgnTable').DataTable();
            table.clear(); // Clear existing data
            data.moves.forEach(row => {
              table.row.add([
                row["Move #"],
                row["White Move"],
                row["White User"],
                row["Black Move"],
                row["Black User"]
              ]);
            });
            table.draw();

            rowCount = table.rows().count() - 1;
            colCount = table.columns().count() - 1;
            let side = data.orientation === 'white' ? 1 : 3;
            colCount = colCount - side;
            if (rowCount > 0 && colCount > 0) {
              let cellNode = table.cell(rowCount, colCount).node();
              if (cellNode) {
                $(cellNode).attr('tabindex', '-1').focus();
              }
            }
          }
          if (board) {
            const newOrientation = board.orientation(data.orientation)
            moveOrientationColor = data.orientation;
          }
        });
      }

      $(document).ready(function() {
        let table = $('#pgnTable').DataTable({
          paging: false,
          searching: true,
          info: false,
          autoWidth: true,
          columnDefs: [
            { className: "dt-center", targets: "_all" }
          ]
        });

        updateStatus();

        $('#pgnTable tbody').on('click', 'td', function() {
          let cell = table.cell(this);
          let column = cell.index().column;

          if (column === 0 || column === 2 || column === 4) {
            let cellNode = table.cell(rowCount, colCount).node();
            if (cellNode) {
              $(cellNode).attr('tabindex', '-1').focus();
            }
            return;
          }

          let cellNode = cell.node();
          if (cellNode) {
            $(cellNode).attr('tabindex', '-1').focus();
          }

          if (cell.data() === "waiting") { return; }

          rowCount = cell.index().row;
          colCount = column;

          let row = table.row(this.parentNode);
          let movePair = row.data()[0];
          let movePlayer = column === 1 ? 'white' : 'black';

          fetch('/fen_string' , {
            method: `POST`,
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ move_pair: movePair, move_player: movePlayer })
          })
            .then(response => response.json())
            .then(data => {
              let fenString = data.fen_string_value;
              board.fen(fenString);
              if (currentFEN === fenString) {
                viewState = false;
              } else {
                viewState = true;
              }
            })
            .catch(error => {
              console.error('Error:', error);
            })
        });

        $(document).on('mousedown', function (e) {
          e.preventDefault();
        });

        $(document).on('keydown', function (e) {
          let lastRow = table.rows().count() - 1;
          let lastCol = table.columns().count() - 2;
          let checkCell = table.cell(lastRow, lastCol).data();

          let cellIndex = table.cell(rowCount, colCount).index();
          if (e.key === 'ArrowRight') {
            //move forward in history
            if (rowCount <= table.rows().count() - 1) {

              if (cellIndex.row === table.rows().count() - 1 && cellIndex.column === 3) {
                rowCount = table.rows().count() - 1;
                colCount = 3;
              } else if (cellIndex.row === table.rows().count() - 1 && cellIndex.column === 1 && checkCell === "waiting") {
                return;
              } else {
                if (cellIndex.column === 1) {
                  colCount = 3;
                } else {
                  colCount = 1;
                  rowCount = rowCount + 1;
                }
              }
            }
          } else if (e.key === 'ArrowLeft') {
            //move backwards in history
            if (rowCount >= 0) {
              if (cellIndex.row === 0 && cellIndex.column === 1) {
                rowCount = 0;
                colCount = 1;
              } else {
                if (cellIndex.column === 3) {
                  colCount = 1;
                } else {
                  colCount = 3;
                  rowCount = rowCount - 1;
                }
              }
            }
          } else {
            return;
          }
          cellNode = table.cell(rowCount, colCount).node();
          if (cellNode) {
            $(cellNode).attr('tabindex', '-1').focus();
          }

          let row = table.row(rowCount);
          let movePair = row.data()[0];
          let movePlayer = colCount === 1 ? 'white' : 'black';

          fetch('/fen_string' , {
            method: `POST`,
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ move_pair: movePair, move_player: movePlayer })
          })
            .then(response => response.json())
            .then(data => {
              let fenString = data.fen_string_value;
              board.fen(fenString);
              if (currentFEN === fenString) {
                viewState = false;
              } else {
                viewState = true;
              }
            })
            .catch(error => {
              console.error('Error:', error);
            })
          e.preventDefault();
        });
      });

      // Reset the board (call server /reset)
      function resetGame() {
        window.location.href = "/reset";
      }
    </script>
  </div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}

<!-- Script -->
<script>window.initialFen = "{{ fen }}";</script>
<script src="{{ url_for('static', filename='chess.js') }}"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

<main class="container">
    <article class="game-container">
	<section class="board-wrapper">
            <div class="notation notation-bottom" id="notation-bottom">
                <!-- Dynamic content will be added here -->
            </div>
            <div class="notation notation-left" id="notation-left">
                <!-- Dynamic content will be added here -->
            </div>
            <div class="board" id="myBoard"></div>
        </section>
        <aside class="info-box">
            <h1>Office Chess: Welcome, {{ name }}!</h1>
            <div id="status"></div>
            <div class="scrollable-table">
                <table id="pgnTable" class="display compact" cellspacing="0" width=100%>
                    <thead>
                        <tr>
                            <th colspan="1">#</th>
                            <th colspan="2">White</th>
                            <th colspan="2">Black</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows will be dynamically added -->
                    </tbody>
                </table>
            </div>
            <button onclick="resetGame()">Reset Game</button>
        </aside>
    </article>
</main>

<footer>
    <p>© <span id="year"></span> MGW Chess</p>
    <script>
        window.onload = function() {
            const currentYear = new Date().getFullYear();
            document.getElementById('year').textContent = currentYear;
        };
    </script>
</footer>

{% endblock %}
